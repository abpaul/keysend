<!doctype html>
<html lang="{{ lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background:#F5F5F7; color:#292039;">
  <div style="display:none; max-height:0; overflow:hidden;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F5F5F7;">
    <tr>
      <td align="center" style="padding:24px 12px 40px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px; font-family:'Plus Jakarta Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:17px; line-height:26px; color:#292039; text-align:left;">
          <tr>
            <td style="padding:0 8px 16px; font-size:21px; line-height:24px; font-weight:800; letter-spacing:-0.03em; color:#292039;">KeySend</td>
          </tr>
          <tr>
            <td style="padding:32px 28px; background:#FFFFFF; border-radius:20px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:'Plus Jakarta Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:17px; line-height:26px; color:#292039;">
{% block content %}{% endblock content %}
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 8px 0; font-size:14px; line-height:21px; color:#5C5470;">{{ footer }}<br>{{ note }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
