logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  host: http://localhost
  ident: ""
  middlewares:
    static:
      enable: false
    fallback:
      enable: false

workers:
  mode: ForegroundBlocking

queue:
  kind: Sqlite
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://keysend_test.sqlite?mode=rwc") %>
  dangerously_flush: false

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://keysend_test.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

settings:
  google:
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    userinfo_url: https://openidconnect.googleapis.com/v1/userinfo
    ads_api_base: https://googleads.googleapis.com/v25
