logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="5150") %>
  binding: <%= get_env(name="BINDING", default="localhost") %>
  host: http://localhost
  ident: ""
  middlewares:
    static:
      enable: false
    fallback:
      enable: false

workers:
  mode: BackgroundQueue

queue:
  kind: Sqlite
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://keysend_development.sqlite?mode=rwc") %>
  dangerously_flush: false
  num_workers: 4
  reaper:
    age_minutes: 6
    interval_seconds: 60

database:
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://keysend_development.sqlite?mode=rwc") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

settings:
  google:
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth
    token_url: https://oauth2.googleapis.com/token
    userinfo_url: https://openidconnect.googleapis.com/v1/userinfo
    ads_api_base: https://googleads.googleapis.com/v25
