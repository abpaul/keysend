[package]
name = "credseal"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Encrypted, per-environment TOML credentials with a Rails-style edit workflow"
license = "Apache-2.0"
keywords = ["credentials", "secrets", "encryption", "config"]
categories = ["config", "cryptography", "command-line-utilities"]
readme = "README.md"
publish = false
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[features]
default = []
cli = ["dep:clap", "dep:shell-words", "dep:tempfile", "dep:signal-hook"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Not used directly: enables zeroizing of the AES key schedule inside aes-gcm.
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
base64 = "0.22.1"
getrandom = "0.4.3"
serde = "1.0.228"
thiserror = "2.0.18"
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
zeroize = "1.8.2"
clap = { version = "4.5.53", features = ["derive"], optional = true }
shell-words = { version = "1.1.1", optional = true }
tempfile = { version = "3.23.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"
signal-hook = { version = "0.4.5", default-features = false, optional = true }

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"

[[bin]]
name = "credseal"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[bench]]
name = "credentials"
path = "benches/credentials.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
correctness = "deny"
